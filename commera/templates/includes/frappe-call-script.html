<script>
    async function frappe_call(url, args, method = "POST") {
        let response;
        let headers = {
            'Content-Type': 'application/json; charset=utf-8',
            "X-Frappe-CSRF-Token": '{{ frappe.session.csrf_token }}',
            Accept: "application/json",
        }
        if (method === "POST") {
            response = await fetch(url, {
                body: JSON.stringify(args),
                method: "POST",
                headers
            })
        }
        else if (method === "PUT") {
            response = await fetch(url, {
                body: JSON.stringify(args),
                method: "PUT",
                headers
            })
        }
        else {
            response = await fetch(url)
        }

        const fallback_message = {{ _("Something went wrong") | tojson }}
        let data
        try {
            data = await response.json()
        } catch (error) {
            toast(fallback_message, { type: "danger" })
            throw error
        }

        if (data.errors) {
            const error = data.errors[0]

            if (error.message) {
                toast(error.message, { type: "danger" })
            } else {
                toast({{ _("Internal Server Error") | tojson }}, { type: "danger" })
            }

            throw Error(error.exception)
        }

        if (!response.ok) {
            toast(fallback_message, { type: "danger" })
            throw Error(`${response.status} ${response.statusText}`)
        }

        return data
    }
</script>
