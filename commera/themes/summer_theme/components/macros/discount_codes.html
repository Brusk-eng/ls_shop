{% macro discount_code_chips(codes, saving, remove) -%}
<div class="checkout-discount-codes" x-show="{{ codes }}.length" x-cloak>
	<template x-for="code_state in {{ codes }}" :key="code_state.code">
		<div class="checkout-discount-code-state">
			<span class="checkout-discount-chip">
				<i class="fa-solid fa-tag"></i>
				<span x-text="code_state.code"></span>
				<button type="button" :aria-label="`{{ _('Remove') }} ${code_state.code}`"
					:disabled="{{ saving }}" @click="{{ remove }}(code_state.code)">
					<i class="fa-solid fa-xmark"></i>
				</button>
			</span>
			<p class="checkout-discount-reason" x-show="code_state.reason" x-text="code_state.reason"></p>
		</div>
	</template>
</div>
{%- endmacro %}
