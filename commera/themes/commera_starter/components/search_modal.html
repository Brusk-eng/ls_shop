{% from "components/macros/icons.html" import icon %}
{% set language = frappe.lang or "en" %}

<div x-data="search_modal" x-cloak x-show="open" @open-search.window="show()" @keydown.escape.window="open = false" class="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="{{ _('Search') }}">
	<div @click="open = false" class="absolute inset-0 bg-surface-alpha-gray-6"></div>
	<div class="relative bg-surface-base px-5 py-4 shadow-2xl md:px-12">
		<form action="/{{ language }}/products" class="relative mx-auto flex max-w-2xl gap-2" role="search">
			<input x-ref="search_input" type="text" enterkeyhint="search" name="search" x-model="query" @input.debounce.200ms="search()" autocomplete="off" placeholder="{{ _('Search products') }}" aria-label="{{ _('Search products') }}" class="h-10 w-full min-w-0 rounded-lg border border-transparent bg-surface-gray-2 px-3 text-lg text-ink-gray-8 outline-none placeholder:text-ink-gray-4 hover:bg-surface-gray-3 focus:border-outline-gray-4 focus:bg-surface-base focus:shadow-sm">
			<div x-cloak x-show="results && (results.products.length || results.categories.length)" class="absolute inset-x-0 top-full z-50 mt-1 divide-y divide-outline-elevation-2 rounded-xl bg-surface-elevation-2 text-start shadow-2xl ring-1 ring-outline-gray-2">
				<div x-show="results?.products.length" class="p-1.5">
					<template x-for="product in results?.products ?? []" :key="product.id">
						<a :href="product_url(product)" class="flex items-center gap-3 rounded-lg p-2 hover:bg-surface-gray-3">
							<span class="aspect-[3/4] w-10 overflow-hidden rounded-md bg-surface-gray-2"><img x-show="product.image" :src="product.image" alt="" class="size-full object-cover object-top"></span>
							<span class="flex-1 text-base text-ink-gray-8" x-text="product.title"></span>
							<span class="text-base text-ink-gray-8" x-text="money(product)"></span>
						</a>
					</template>
				</div>
				<div x-show="results?.categories.length" class="p-1.5">
					<template x-for="category in results?.categories ?? []" :key="category.url">
						<a :href="category.url" class="flex h-7 items-center rounded-lg px-2 text-base text-ink-gray-8 hover:bg-surface-gray-3" x-text="category.title"></a>
					</template>
				</div>
			</div>
			<button type="button" @click="open = false" class="grid size-10 shrink-0 place-items-center rounded-lg text-ink-gray-8 hover:bg-surface-gray-3" aria-label="{{ _('Close') }}">{{ icon("close") }}</button>
		</form>
	</div>
</div>
